# SPDX-License-Identifier: AGPL-3.0-or-later
# Flutter app: analysis, widget tests, formatting and a Windows build.
# Fremde Actions sind auf feste Commit-IDs festgenagelt (Lieferkette).
name: App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  check:
    name: App prüfen (Analyse, Tests, Format)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # --enforce-lockfile: exactly the versions in pubspec.lock, checked
      # against their sha256, or the run fails.
      - name: Pakete holen
        id: deps
        run: flutter pub get --enforce-lockfile
      - name: Lizenzen der Dart-Pakete prüfen
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 ../tools/dart_licenses.py --verify
      # Each check runs even if an earlier one failed, so one run shows
      # every problem at once.
      - name: Analyse
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: flutter analyze
      # The real security core and server, so test/door_native_test.dart and
      # test/server_native_test.dart run the app against them (Argon2id with
      # the real settings, pairing through the real relay).
      - name: Sicherheitskern und Server bauen
        id: core
        working-directory: .
        run: cargo build -p trair-ffi -p trair-server --release --locked
      - name: Widget-Tests, Tür zum Kern und Koppeln über den echten Server
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.core.outcome == 'success' }}
        env:
          TRAIR_FFI_LIB: ${{ github.workspace }}/target/release/libtrair_ffi.so
          TRAIR_SERVER_BIN: ${{ github.workspace }}/target/release/trair-server
        run: flutter test
      - name: Bildschirmfotos hochladen
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trair-Screenshots
          path: app/build/screenshots/
          retention-days: 14
          if-no-files-found: warn
      # Also into the log as base64: lets reviewers (and Claude, whose
      # sandbox cannot download artifacts) look at the pictures.
      - name: Bildschirmfotos ins Protokoll
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          for f in build/screenshots/*.png; do
            [ -e "$f" ] || continue
            echo "=====BEGIN $(basename "$f")====="
            base64 -w 2000 "$f"
            echo "=====END====="
          done
      - name: Formatierung
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          dart format .
          git diff --exit-code -- .

  windows:
    name: Windows-Build
    runs-on: windows-2025
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The Windows runner files are generated here and not kept in Git
      # yet. Only the name shown in Windows and the program icon change.
      - name: Windows-Projektdateien erzeugen
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name trair_app .
          (Get-Content windows/runner/main.cpp) -replace 'L"trair_app"', 'L"Trair"' | Set-Content windows/runner/main.cpp
          (Get-Content windows/CMakeLists.txt) -replace 'set\(BINARY_NAME "trair_app"\)', 'set(BINARY_NAME "Trair")' | Set-Content windows/CMakeLists.txt
          (Get-Content windows/runner/Runner.rc) -replace 'trair_app', 'Trair' -replace 'com\.example', 'Trair contributors' | Set-Content windows/runner/Runner.rc
          Copy-Item assets/branding/app_icon.ico windows/runner/resources/app_icon.ico -Force
          if (-not (Select-String -Path windows/runner/main.cpp -Pattern 'L"Trair"' -Quiet)) { throw "Fenstertitel nicht gesetzt" }
          if (-not (Select-String -Path windows/CMakeLists.txt -Pattern 'BINARY_NAME "Trair"' -Quiet)) { throw "Dateiname nicht gesetzt" }
      # The core's Windows parts (DPAPI, screenshot block) are checked and
      # tested here, on Windows, together with the chat database (SQLCipher
      # with OpenSSL, built from source); then the DLL is built and placed
      # next to Trair.exe.
      - name: Clippy für Windows-Code
        working-directory: .
        run: cargo clippy -p trair-ffi -p trair-core --all-targets --locked -- -D warnings
      - name: Sicherheitskern, Chats und Team-Werkzeug testen (Windows)
        working-directory: .
        run: cargo test -p trair-ffi -p trair-core -p trair-team --locked
      - name: Sicherheitskern bauen
        working-directory: .
        run: cargo build -p trair-ffi --release --locked
      - name: Bauen
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release
      - name: Kern dazulegen und Dateien prüfen
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          Copy-Item ../target/release/trair_ffi.dll $out/trair_ffi.dll -Force
          foreach ($f in "Trair.exe", "trair_ffi.dll") {
            if (-not (Test-Path "$out/$f")) { throw "$f fehlt" }
          }
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trair-Windows-Demo
          path: app/build/windows/x64/runner/Release/
          retention-days: 30
          if-no-files-found: error
      # The team tool for the project owner: makes the team key on their own
      # computer. The key itself never comes near CI.
      - name: Team-Werkzeug und Server bauen
        working-directory: .
        run: cargo build -p trair-team -p trair-server --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trair-Team-Werkzeug
          path: target/release/trair-team.exe
          retention-days: 30
          if-no-files-found: error
      # The server for trying pairing on one computer (M3, step 3). It only
      # listens on 127.0.0.1 until TLS exists.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trair-Server
          path: target/release/trair-server.exe
          retention-days: 30
          if-no-files-found: error
