# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "trair-bot"
description = "Trair bots: runs a bot account and speaks JSON lines with the bot's own code (milestone M9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "trair-bot"
path = "src/main.rs"

[dependencies]
trair-core = { path = "../trair-core" }
# The same door the app uses: vault, chats, checks. The bot only adds
# the network around it.
trair-ffi = { path = "../trair-ffi" }
serde_json = "1.0.154"
# HTTP client. MIT OR Apache-2.0. Without TLS for now: like the app, a bot
# talks only to a server on the same computer until TLS is done.
ureq = { version = "=3.5.2", default-features = false, features = ["json"] }
# Asks for the password without showing it. Apache-2.0.
rpassword = "=7.5.5"

[dev-dependencies]
trair-server = { path = "../trair-server" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
getrandom = "=0.4.3"
