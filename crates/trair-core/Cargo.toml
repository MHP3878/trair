# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "trair-core"
description = "Trair core: accounts, devices, MLS groups and the strict security policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# MLS (RFC 9420). MIT licensed. Exact versions: crypto updates are
# reviewed by hand, never pulled in silently.
openmls = "=0.9.2"
# "clonable": a device restored from the vault needs its own copy of the key.
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# Vault (launcher password). RustCrypto, MIT OR Apache-2.0, exact versions
# like the MLS crates. chacha20poly1305 is the version openmls already uses.
argon2 = "=0.6.0"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.4.3"
zeroize = "=1.9.2"
# Pairing (M2): SPAKE2 from RustCrypto, MIT OR Apache-2.0.
spake2 = "=0.4.0"
# Chats on disk (M4): SQLCipher (BSD-3-Clause) encrypts the whole database
# file. Its crypto comes from OpenSSL (Apache-2.0), built from source with
# the program, so no system library is needed. Same rusqlite as the server.
rusqlite = { version = "=0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
# Profile pictures from other people (step 3): decoded with limits and
# written anew, so a crafted file never reaches the app. Pure Rust,
# MIT OR Apache-2.0.
png = "=0.18.1"
base64 = "=0.22.1"
