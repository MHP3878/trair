# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "trair-core"
description = "Trair core: accounts, devices, MLS groups and the strict security policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# MLS (RFC 9420). MIT licensed. Exact versions: crypto updates are
# reviewed by hand, never pulled in silently.
openmls = "=0.9.2"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# Vault (launcher password). RustCrypto, MIT OR Apache-2.0, exact versions
# like the MLS crates. chacha20poly1305 is the version openmls already uses.
argon2 = "=0.6.0"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.4.3"
zeroize = "=1.9.2"
