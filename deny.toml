# cargo-deny: prueft Lizenzen, bekannte Schwachstellen und Paketquellen.

[graph]
all-features = true

[advisories]
version = 2
# Jede bekannte Schwachstelle laesst CI fehlschlagen. Ausnahmen nur mit
# schriftlicher Begruendung hier und im Planungsdokument.
ignore = [
    # crypto-bigint 0.5.5 (ueber elliptic-curve) wird nur fuer die NIST-Kurven
    # P-256/P-384/K-256 benutzt. Trair verwendet ausschliesslich X25519 und
    # Ed25519, und der Kern lehnt Schluesselpakete mit anderer Cipher-Suite ab
    # (Test other_cipher_suites_are_refused). Erneut pruefen, sobald OpenMLS
    # eine Version ohne crypto-bigint 0.5 anbietet.
    { id = "RUSTSEC-2026-0387", reason = "nur NIST-Kurven betroffen, Trair nutzt sie nicht" },
    # proc-macro-error2 ist ein Hilfsmakro, das nur beim Bauen laeuft
    # (hax-lib-macros ueber libcrux). Kein Code davon landet im Programm.
    # "Nicht mehr gepflegt" ist keine Schwachstelle.
    { id = "RUSTSEC-2026-0173", reason = "nur Bauzeit-Makro, keine Schwachstelle" },
]

[licenses]
version = 2
# Nur freie Lizenzen, die mit AGPL-3.0 vereinbar sind und keine
# GPL-Familie fuer Fremdcode (sonst koennte die geplante App-Store-
# Zusatzerlaubnis nicht fuer den ganzen Code gelten).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

# Trairs eigene Pakete stehen unter AGPL-3.0-or-later.
[[licenses.exceptions]]
crate = "trair-core"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "trair-ffi"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "trair-server"
allow = ["AGPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Verweise zwischen Trairs eigenen, nicht veroeffentlichten Paketen
# (path = "...") sind erlaubt; alle Fremdpakete brauchen feste Versionen.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
