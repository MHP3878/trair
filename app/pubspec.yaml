# SPDX-License-Identifier: AGPL-3.0-or-later
name: trair_app
description: "Trair – Private communication. Windows app (Flutter), demo data until the Rust core is connected."
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ^3.8.0

# No packages from pub.dev yet: only the Flutter SDK itself. Fonts are
# bundled (SIL OFL 1.1), so the app never loads anything from the internet.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
