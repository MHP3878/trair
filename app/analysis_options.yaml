# Strict analysis without extra packages from pub.dev.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
    dead_code: error

formatter:
  page_width: 120

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_single_quotes
    - unnecessary_this
    - use_key_in_widget_constructors
